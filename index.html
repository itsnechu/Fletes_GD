<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
    <link rel="stylesheet" href="estilo.css">
    <script src="app.js" defer></script>
    <script src="https://unpkg.com/@shaun/alpinejs-router@1.x.x/dist/router.min.js" defer></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <title>Sistema de fletes</title>
</head>
<body x-data="contexto('home')">
    <aside>
        <a x-link href="/"><button>Inicio</button></a>
        <a x-link href="/unidades"><button>Unidades</button></a>
        <a x-link href="/choferes"><button>Choferes</button></a>
        <a x-link href="/clientes"><button>Clientes</button></a>
        <a x-link href="/fletes"><button>Fletes</button></a>
    </aside>
    <main>
        <template x-route="/">
            <p>Inicio</p>
        </template>
        <template x-route="/unidades" template="/unidadesView.html"></template>
        <template x-route="/choferes" template="/choferesView.html"></template>
        <template x-route="/clientes" template="/clientesView.html"></template>
        <template x-route="/fletes" template="/fletesView.html"></template>
    </main>
</body>
</html>
